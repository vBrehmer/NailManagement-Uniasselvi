<aside class="sidebar bg-white shadow-2xl relative min-h-screen flex flex-col"
        [style.width.px]="width">
        <div class="logo flex items-center gap-2">
            <img class="" src="img/NailManagementLogo.png" alt="">
        </div>

        <nav mat-list class="flex flex-col flex-1 items-center w-full">
            
            <button 
            routerLink="/agenda"
            routerLinkActive="bg-blue-50 text-blue-600 border-l-4 border-blue-600 shadow-sm"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex transition-all cursor-pointer w-full py-2 justify-center">
                <div class="flex flex-col items-center h-fit ">
                    <mat-icon MatListItemIcon >event_avaliable</mat-icon>
                    <span class="text-xl">Agenda</span>
                </div>
            </button>    

            <button 
            routerLink="/cliente"
            routerLinkActive="bg-blue-50 text-blue-600 border-l-4 border-blue-600 shadow-sm"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex transition-all py-2 cursor-pointer w-full justify-center">
                <div class="flex flex-col items-center h-fit">
                    <mat-icon MatListItemIcon class="">account_circle</mat-icon>
                    <span class="text-xl">Cliente</span>
                </div>
            </button>    

            <button 
            routerLink="/profissional"
            routerLinkActive="bg-blue-50 text-blue-600 border-l-4 border-blue-600 shadow-sm"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex transition-all py-2 cursor-pointer w-full justify-center">
                <div class="flex flex-col items-center h-fit">
                    <mat-icon MatListItemIcon class="">support_agent</mat-icon>
                    <span class="text-xl">Profissional</span>
                </div>
            </button>    

            <button 
            routerLink="/servico"
            routerLinkActive="bg-blue-50 text-blue-600 border-l-4 border-blue-600 shadow-sm"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex transition-all py-2 cursor-pointer w-full justify-center">
                <div class="flex flex-col items-center h-fit">
                    <mat-icon MatListItemIcon class="">handyman</mat-icon>
                    <span class="text-xl">Serviço</span>
                </div>
            </button>     
        </nav>  

        @if (userService.retornarUser() | async; as user) {
            <span class="font-bold text-slate-800 w-full h-8 flex justify-center">
                Olá, {{ user.username }}!
            </span>
        }
        <button
        (click)="logout()" 
        class="group flex items-center justify-center gap-3 px-6 py-3 bg-white text-slate-600 font-bold rounded-2xl border border-slate-100 shadow-sm hover:bg-red-50 hover:text-red-600 hover:border-red-100 transition-all duration-300 active:scale-95">
  
            <span class="text-sm">Logout</span>
          
            <mat-icon class="transition-transform duration-300 group-hover:translate-x-1">
              logout
            </mat-icon>
          
          </button>

    <div (mousedown)="onMouseDown($event)" 
        class="absolute top-0 right-0 w-0.5 h-full cursor-col-resize hover:bg-blue-400 transition-colors">
    </div> 
</aside>
